<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positivus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
  />
  <link rel="stylesheet" href="style.css">
  <script defer src="index.js"></script>
</head>
<body class="page">
  <header class="header">
    <div class="container">
      <div class="header__wrapper">
        <a class="header__logo link-reset" href="#" >
          <img class="header__img" src="./icon/header/logo.svg" alt="Logo site" width="219" height="36">
        </a>
        <div class="header__actions">
          <nav class="header__nav">
            <ul class="header__nav-list list-reset">
              <li class="header__nav-item header__nav-item--active">
                <a class="header__nav-link link-reset" href="#">About us</a>
              </li>
              <li class="header__nav-item">
                <a class="header__nav-link link-reset" href="">Services</a>
              </li>
              <li class="header__nav-item">
                <a class="header__nav-link link-reset" href="">Use Cases</a>
              </li>
              <li class="header__nav-item">
                <a class="header__nav-link link-reset" href="">Pricing</a>
              </li>
              <li class="header__nav-item">
                <a class="header__nav-link link-reset" href="">Blog</a>
              </li>
            </ul>
          </nav>
          <button class="header__req button-reset" type="button">Request a quote</button>
        </div>
        <button class="header__burger button-reset" aria-label="Open mobile menu" aria-expanded="false">
          <div class="visually-hidden">Open mobile menu</div>
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="hero">
      <div class="container">
        <div class="hero__inner">
          <div class="hero__content">
            <h1 class="hero__title">
              Navigating the digital landscape for success
            </h1>
            <p class="hero__desc">
              Our digital marketing agency helps businesses grow and succeed online through a&nbsp;range of&nbsp;services including SEO, PPC, social media marketing, and content creation.
            </p>
            <button class="hero__button button-reset">Book a consultation</button>
          </div>
          <div class="hero__image">

          </div>
        </div>
        <div class="hero__swiper swiper">
          <div class="hero__swiper-container swiper-wrapper">
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/amazon.svg"
              alt="Amazon logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/drobble.svg"
              alt="Dribble logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/hubspot.svg"
              alt="HubSpot logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/notion.svg"
              alt="Notion logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/zoom.svg"
              alt="Zoom logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/amazon.svg"
              alt="Amazon logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/drobble.svg"
              alt="Dribble logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/hubspot.svg"
              alt="HubSpot logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/notion.svg"
              alt="Notion logo"
            >
            <img
              class="hero__swiper-item swiper-slide"
              src="./icon/hero/zoom.svg"
              alt="Zoom logo"
            >
            
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="overlay"></div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
</body>
</html>
